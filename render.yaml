services:
  # ── Backend Flask API ────────────────────────────────
  - type: web
    name: planme-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: planme-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: HF_TOKEN
        sync: false
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── Frontend React App ───────────────────────────────
  - type: web
    name: planme-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://planme-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── PostgreSQL Database ──────────────────────────────
  - type: postgresql
    name: planme-db
    plan: free
    ipAllowList: []